function csvParse(text){const delim=text.includes('\t')?'\t':',';let rows=[],row=[],s='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){s+='"';i++}else quoted=!quoted}else if(!quoted&&c===delim){row.push(s);s=''}else if(!quoted&&(c==='\n'||c==='\r')){if(c==='\r'&&text[i+1]==='\n')i++;row.push(s);rows.push(row);row=[];s=''}else s+=c}if(quoted)throw Error('CSV เครื่องหมายคำพูดไม่ครบ');if(s||row.length){row.push(s);rows.push(row)}return rows.filter(r=>r.some(v=>v!==''))}

function calc(e){let total=0,missing=0,valid=!!B.items.length;const c=B.course,groups=c.method==='raw'?[{id:'raw',weight:100}]:B.categories;if(c.method==='weighted'&&Math.abs(groups.reduce((n,g)=>n+g.weight,0)-100)>1e-7)valid=false;groups.forEach(g=>{const a=B.items.filter(i=>(c.method==='raw'||i.categoryId===g.id)&&!(c.exemption==='redistribute'&&getCell(e.id,i.id).status==='ยกเว้นการประเมิน'));const w=i=>c.method==='raw'?i.max:i.weight;const den=a.reduce((n,i)=>n+w(i),0);if(!den){if(g.weight>0)valid=false;return}a.forEach(i=>{const s=getCell(e.id,i.id);if(s.status==='มีคะแนน')total+=g.weight*w(i)/den*Number(s.value)/i.max;else missing++})});const r=c.rounding==='integer'?Math.round(total):c.rounding==='two'?Math.round((total+Number.EPSILON)*100)/100:total;return {total,grade:B.overrides.find(o=>o.enrollmentId===e.id)?.status||(!valid||missing?'คะแนนไม่ครบ':B.criteria.slice().sort((a,b)=>b.min-a.min).find(g=>r>=g.min)?.grade??'คะแนนไม่ครบ')}}

const originalButton=button;button=function(label,code,style='primary'){return `<button class="btn btn-${style} btn-sm" onclick="act(async()=>{${code.replace(/"/g,'&quot;')}})">${E(label)}</button>`};
const days=['','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'],attStates=['มาเรียน','ขาดเรียน','มาสาย','ลาป่วย','ลากิจ','กิจกรรม','ยังไม่เช็ก'];
let attDate=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Bangkok'}).format(new Date()),attPeriod=1,attData=null,attDirty=false,attSaving=false,randomRoom='',randomYear='',scheduleYear='';
function yearOptions(){return D.years.map(y=>[y.id,labelYear(y.id)])}
async function leaveAttendance(){if(attSaving)throw Error('กำลังบันทึกเวลาเรียน');if(attDirty){const r=await Swal.fire({title:'ยังไม่ได้บันทึกเวลาเรียน',text:'ต้องการละทิ้งการแก้ไขหรือไม่',showCancelButton:true,confirmButtonText:'ละทิ้ง',cancelButtonText:'กลับไปบันทึก'});if(!r.isConfirmed)return false;attDirty=false}return true}
window.addEventListener('beforeunload',e=>{if(attDirty||attSaving){e.preventDefault();e.returnValue=''}});
async function schedulePage(){scheduleYear=scheduleYear||D.settings.currentYear||D.years[0]?.id;if(!scheduleYear){show(panel('กรุณาสร้างภาคเรียน'));return}const g=generation,y=scheduleYear,items=await rpc('getTeachingSchedule',y);if(g!==generation||y!==scheduleYear)return;const periods=[...new Set([...Array.from({length:8},(_,i)=>i+1),...items.map(x=>x.period)])].sort((a,b)=>a-b);show(panel(`<div class="toolbar noprint">${sel('sy',yearOptions(),y,'act(async()=>{scheduleYear=this.value;await schedulePage()})')}${button('เพิ่มคาบสอน','return scheduleEdit()')}${button('พิมพ์ตาราง','window.print()','outline-secondary')}</div>`+table(['วัน / คาบ',...periods.map(x=>'คาบ '+x)],days.slice(1).map((d,i)=>[E(d),...periods.map(p=>{const a=items.find(x=>x.day===i+1&&x.period===p);return a?`<div class="p-2 rounded" style="border:1px solid var(--accent);white-space:normal;min-width:130px"><strong>${E(labelCourse(D.courses.find(c=>c.id===a.courseId)))}</strong><br>${E(a.start)}–${E(a.end)}<br>${E(a.note)}<div class="noprint">${button('เช็กชื่อ',`return fromSchedule(${J(a)})`)} ${button('แก้ไข',`return scheduleEdit(${J(a)})`,'outline-secondary')} ${button('เก็บถาวร',`return archiveSchedule(${J(a)})`,'outline-danger')}</div></div>`:'—'})]))))}
async function scheduleEdit(old={}){const choices=D.courses.filter(c=>c.yearId===scheduleYear).map(c=>[c.id,labelCourse(c)]);if(!choices.length)throw Error('กรุณาเปิดสอนรายวิชาในภาคเรียนนี้');const o=await form('จัดการคาบสอน',[['courseId','รายวิชา / ห้อง','select',choices],['day','วัน','select',days.slice(1).map((d,i)=>[i+1,d])],['period','คาบ','number'],['start','เริ่ม','time'],['end','สิ้นสุด','time'],['note','หมายเหตุ']],{period:1,start:'08:30',end:'09:20',...old});if(o){await rpc('saveTeachingSchedule',o);toast('บันทึกแล้ว');await schedulePage()}}
async function archiveSchedule(o){const r=await Swal.fire({title:'เก็บคาบสอนนี้ถาวร?',showCancelButton:true});if(r.isConfirmed){await rpc('saveTeachingSchedule',{...o,archived:true});await schedulePage()}}
async function fromSchedule(o){const c=D.courses.find(c=>c.id===o.courseId);year=c.yearId;subject=c.subjectId;room=c.roomId;attPeriod=o.period;const dt=new Date(attDate+'T12:00:00+07:00');const day=dt.getUTCDay()||7;dt.setUTCDate(dt.getUTCDate()+o.day-day);attDate=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Bangkok'}).format(dt);await go(14)}
async function attendancePage(){const p=coursePicker();if(!cid){show(panel(p+'กรุณาเปิดสอนรายวิชาก่อน'));return}const g=generation,id=cid,date=attDate,period=attPeriod;const b=await rpc('getAttendance',id,date,period);if(g!==generation||id!==cid||date!==attDate||period!==attPeriod)return;attData=b;attDirty=false;show(panel(p+`<div class="toolbar noprint"><label>วันที่</label><input type="date" class="form-control w-auto" value="${E(attDate)}" onchange="act(()=>changeAttendance('date',this.value))"><label>คาบ</label>${sel('ap',Array.from({length:20},(_,i)=>[i+1,i+1]),attPeriod,"act(()=>changeAttendance('period',this.value))")}${button('มาเรียนทั้งหมด','markAllAttendance()')}${button('บันทึกเวลาเรียน','return storeAttendance()')}${button('สรุปเวลาเรียน','return attendanceSummary()','outline-primary')}${button('พิมพ์','window.print()','outline-secondary')}</div><p>${E(labelCourse(D.courses.find(c=>c.id===cid)))} · ${E(attDate)} · คาบ ${attPeriod}</p><div id="attCounts" class="metrics mb-3"></div><div id="attRows"></div><div id="attSaved" class="small mt-2"></div>`));renderAttendanceRows()}
async function changeAttendance(k,v){if(!await leaveAttendance()){await attendancePagePreserve();return}if(k==='date')attDate=v;else attPeriod=Number(v);await attendancePage()}
function attendancePagePreserve(){const date=$('content').querySelector('input[type=date]');if(date)date.value=attDate;if($('ap'))$('ap').value=attPeriod}
function renderAttendanceRows(){$('attRows').innerHTML=table(['เลขที่','ชื่อ–นามสกุล','สถานะ','หมายเหตุ'],attData.records.map((r,i)=>[E(r.number),E(r.name),sel('as'+i,attStates.map(s=>[s,s]),r.status,`setAttendance(${i},'status',this.value)`),`<input class="form-control form-control-sm" value="${E(r.note)}" maxlength="500" oninput="setAttendance(${i},'note',this.value)">`]));attendanceCounts()}
function attendanceCounts(){$('attCounts').innerHTML=attStates.map(s=>`<div class="metric">${E(s)}<strong>${attData.records.filter(r=>r.status===s).length}</strong></div>`).join('');$('attSaved').textContent=attDirty?'ยังไม่ได้บันทึก':attData.session?'บันทึกล่าสุด '+new Date(attData.session.updated).toLocaleString('th-TH'):'ยังไม่มีข้อมูลบันทึก'}
function setAttendance(i,k,v){if(attSaving)return;attData.records[i][k]=v;attDirty=true;attendanceCounts()}
function markAllAttendance(){if(attSaving)return;attData.records.forEach(r=>r.status='มาเรียน');attDirty=true;renderAttendanceRows()}
async function storeAttendance(){if(attSaving)return;attSaving=true;const controls=[...$('content').querySelectorAll('button,input,select')];controls.forEach(x=>x.disabled=true);try{attData=await rpc('saveAttendance',cid,attDate,attPeriod,attData.session?.version||0,attData.records);attDirty=false;toast('บันทึกเวลาเรียนแล้ว')}finally{attSaving=false;controls.forEach(x=>x.disabled=false);attendanceCounts()}}
async function attendanceSummary(){if(attDirty)throw Error('บันทึกเวลาเรียนก่อน');const b=await rpc('getAttendanceSummary',cid);const heads=['เลขที่','ชื่อ',...attStates,'ร้อยละมาเรียน/มาสาย','เสี่ยงต่ำกว่า 80%'];const rows=b.students.map(r=>{const n=attStates.slice(0,6).reduce((a,s)=>a+r.counts[s],0),pct=n?100*(r.counts['มาเรียน']+r.counts['มาสาย'])/n:null;return [r.number,r.name,...attStates.map(s=>r.counts[s]),pct===null?'—':pct.toFixed(2),pct===null?'ไม่ทราบ':pct<80?'เสี่ยง':'—']});show(panel(`<div class="toolbar noprint">${button('กลับไปเช็กชื่อ','return attendancePage()')}${button('พิมพ์','window.print()')}${button('CSV','return downloadAttendance()','outline-primary')}</div><h5>${E(labelCourse(D.courses.find(c=>c.id===cid)))}</h5><p>บันทึก ${b.sessions.length} คาบ · นับมาเรียนและมาสายเป็นเวลาเรียน · ไม่นับคาบที่ยังไม่เช็กในตัวหาร · เป็นเกณฑ์ติดตามเบื้องต้น ไม่ตัดสิน มส อัตโนมัติ</p>`+table(heads,rows.map(r=>r.map(E)))));window.attExport=[heads,...rows]}
function downloadAttendance(){download('attendance.csv','\ufeff'+window.attExport.map(r=>r.map(v=>{let s=String(v);if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(',')).join('\r\n'))}
async function randomPage(){randomYear=randomYear||D.settings.currentYear||D.years[0]?.id;const rooms=D.rooms.filter(r=>D.courses.some(c=>c.yearId===randomYear&&c.roomId===r.id));if(!rooms.some(r=>r.id===randomRoom))randomRoom=rooms[0]?.id||'';const g=generation,y=randomYear,r=randomRoom,b=r?await rpc('getRandomRoster',y,r):{roster:[],history:[],cycle:1};if(g!==generation||y!==randomYear||r!==randomRoom)return;const used=new Set(b.history.map(x=>x.studentId));show(panel(`<div class="toolbar">${sel('ry',yearOptions(),y,'act(async()=>{randomYear=this.value;await randomPage()})')}${sel('rr',rooms.map(r=>[r.id,r.name]),r,'act(async()=>{randomRoom=this.value;await randomPage()})')}</div><div class="text-center py-4"><i class="bi bi-shuffle" style="font-size:48px;color:var(--accent)"></i><h5>สุ่มนักเรียน</h5><div class="display-5 fw-bold my-3" id="drawName">${E(b.history.at(-1)?.name||'พร้อมสุ่ม')}</div><p>นักเรียน ${b.roster.length} คน · ยังไม่ถูกสุ่ม ${b.roster.filter(x=>!used.has(x.studentId)).length} คน · รอบ ${b.cycle}</p><label class="mb-3"><input type="checkbox" id="noRepeat" checked> ไม่สุ่มชื่อซ้ำในรอบเดียวกัน</label><div>${button('สุ่มชื่อ','return runDraw(false)')} ${button('เริ่มรอบใหม่และสุ่ม','return runDraw(true)','outline-primary')}</div></div>`+table(['ลำดับ','ชื่อ','เวลา'],b.history.map((x,i)=>[i+1,E(x.name),E(new Date(x.time).toLocaleString('th-TH'))]))))}
let drawing=false;async function runDraw(reset){if(drawing)return;if(!randomRoom)throw Error('ไม่มีห้องเรียน');drawing=true;try{const v=await rpc('drawStudent',randomYear,randomRoom,$('noRepeat').checked,reset);await randomPage();await Swal.fire({title:'นักเรียนที่ได้รับเลือก',text:v.name,icon:'success'})}finally{drawing=false}}

async function signOut(){if(!await leaveAttendance())return;if(saving||dirty.size){await flush();if(saving||dirty.size)throw Error('ยังมีคะแนนที่ไม่ได้บันทึก');}const t=authToken;authToken='';document.body.classList.add('login-locked');$('loginGate').hidden=false;$('content').replaceChildren();D={};B=null;await requestApi({action:'logout',token:t});location.reload();}
$('loginCard').addEventListener('submit',async e=>{e.preventDefault();const u=$('loginUsername').value.trim(),p=$('loginPassword').value;const btn=$('loginSubmit');btn.disabled=true;$('loginError').textContent='';try{const result=await requestApi({action:'login',username:u,password:p});authToken=result.token;$('loginPassword').value='';await refresh();year=D.settings.currentYear;nav();document.body.classList.remove('login-locked');$('loginGate').hidden=true;await render();}catch(err){$('loginError').textContent=String(err.message||err);document.body.classList.add('login-locked');$('loginGate').hidden=false;}finally{btn.disabled=false;}});
window.addEventListener('pageshow',e=>{if(e.persisted){authToken='';document.body.classList.add('login-locked');$('loginGate').hidden=false;location.reload();}});
window.addEventListener('online',()=>{document.getElementById('networkHint').hidden=true});window.addEventListener('offline',()=>{document.getElementById('networkHint').hidden=false});
if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
