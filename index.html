async function schedulePage(){scheduleYear=scheduleYear||D.settings.currentYear||D.years[0]?.id;if(!scheduleYear){show(panel('กรุณาสร้างภาคเรียน'));return}const g=generation,y=scheduleYear,items=await rpc('getTeachingSchedule',y);if(g!==generation||y!==scheduleYear)return;const periods=[...new Set([...Array.from({length:8},(_,i)=>i+1),...items.map(x=>x.period)])].sort((a,b)=>a-b);show(panel(`<div class="toolbar noprint">${sel('sy',yearOptions(),y,'act(async()=>{scheduleYear=this.value;await schedulePage()})')}${button('เพิ่มคาบสอน','return scheduleEdit()')}${button('พิมพ์ตาราง','window.print()','outline-secondary')}</div>`+table(['วัน / คาบ',...periods.map(x=>'คาบ '+x)],days.slice(1).map((d,i)=>[E(d),...periods.map(p=>{const a=items.find(x=>x.day===i+1&&x.period===p);return a?`<div class="p-2 rounded" style="border:1px solid var(--accent);white-space:normal;min-width:130px"><strong>${E(labelCourse(D.courses.find(c=>c.id===a.courseId)))}</strong><br>${E(a.start)}–${E(a.end)}<br>${E(a.note)}<div class="noprint">${button('เช็กชื่อ',`return fromSchedule(${J(a)})`)} ${button('แก้ไข',`return scheduleEdit(${J(a)})`,'outline-secondary')} ${button('เก็บถาวร',`return archiveSchedule(${J(a)})`,'outline-danger')}</div></div>`:'—'})]))))}
async function scheduleEdit(old={}){const choices=D.courses.filter(c=>c.yearId===scheduleYear).map(c=>[c.id,labelCourse(c)]);if(!choices.length)throw Error('กรุณาเปิดสอนรายวิชาในภาคเรียนนี้');const o=await form('จัดการคาบสอน',[['courseId','รายวิชา / ห้อง','select',choices],['day','วัน','select',days.slice(1).map((d,i)=>[i+1,d])],['period','คาบ','number'],['start','เริ่ม','time'],['end','สิ้นสุด','time'],['note','หมายเหตุ']],{period:1,start:'08:30',end:'09:20',...old});if(o){await rpc('saveTeachingSchedule',o);toast('บันทึกแล้ว');await schedulePage()}}
async function archiveSchedule(o){const r=await Swal.fire({title:'เก็บคาบสอนนี้ถาวร?',showCancelButton:true});if(r.isConfirmed){await rpc('saveTeachingSchedule',{...o,archived:true});await schedulePage()}}
async function fromSchedule(o){const dt=new Date(todayISO()+'T12:00:00Z');dt.setUTCDate(dt.getUTCDate()+o.day-weekDay(todayISO()));return go(14,{courseId:o.courseId,date:dt.toISOString().slice(0,10),period:o.period})}
async function attendancePage(){const p=coursePicker();if(!cid){show(panel(p+'กรุณาเปิดสอนรายวิชาก่อน'));return}const g=generation,id=cid,date=attDate,period=attPeriod;const b=await rpc('getAttendance',id,date,period);if(g!==generation||id!==cid||date!==attDate||period!==attPeriod)return;attData=b;attDirty=false;attFilter='all';show(panel(p+`<div class="toolbar noprint"><label>วันที่</label><input type="date" class="form-control w-auto" value="${E(attDate)}" onchange="act(()=>changeAttendance('date',this.value))"><label>คาบ</label>${sel('ap',Array.from({length:20},(_,i)=>[i+1,i+1]),attPeriod,"act(()=>changeAttendance('period',this.value))")}${button('มาเรียนทั้งหมด','markAllAttendance()')}${button('บันทึกเวลาเรียน','return storeAttendance()')}${button('สรุปเวลาเรียน','return attendanceSummary()','outline-primary')}${button('พิมพ์ทั้งห้อง','printAttendance()','outline-secondary')}</div><p>${E(labelCourse(D.courses.find(c=>c.id===cid)))} · ${E(attDate)} · คาบ ${attPeriod}</p><div id="attCounts" class="metrics mb-3"></div><div class="toolbar noprint"><label for="attFilter">แสดงรายชื่อ</label>${sel('attFilter',[['all','ทุกคน'],['pending','ยังไม่เช็ก'],['absent','ขาด / ลา / สาย / กิจกรรม']],attFilter,"attFilter=this.value;renderAttendanceRows()")}</div><div id="attRows"></div><div class="attendance-footer noprint"><span id="attSaved" role="status"></span>${button('บันทึกเวลาเรียน','return storeAttendance()')}</div>`));renderAttendanceRows()}
async function changeAttendance(k,v){if(!await leaveAttendance()){await attendancePagePreserve();return}if(k==='date')attDate=v;else attPeriod=Number(v);await attendancePage()}
function printAttendance(){attFilter='all';if($('attFilter'))$('attFilter').value='all';renderAttendanceRows();window.print()}
function attendancePagePreserve(){const date=$('content').querySelector('input[type=date]');if(date)date.value=attDate;if($('ap'))$('ap').value=attPeriod}
const attShort=['มา','ขาด','สาย','ป่วย','กิจ','กิจกรรม','ยังไม่เช็ก'];
function renderAttendanceRows(){if(!attData.records.length){$('attRows').innerHTML=`<div class="empty-state"><i class="bi bi-people"></i><b>ยังไม่มีนักเรียนในรายวิชานี้</b><p>ลงทะเบียนจากทะเบียนห้องเรียนก่อนเช็กชื่อ</p>${button('ลงทะเบียนนักเรียน','return enrollUI()')}</div>`;attendanceCounts();return}const list=attData.records.map((r,i)=>({r,i})).filter(({r})=>attFilter==='all'||(attFilter==='pending'?r.status==='ยังไม่เช็ก':!['มาเรียน','ยังไม่เช็ก'].includes(r.status)));$('attRows').innerHTML=list.length?`<div class="att-list">${list.map(({r,i})=>`<div class="att-row" id="attrow${i}"><div class="att-person"><span class="number-chip">${E(r.number)}</span><b>${E(r.name)}</b></div><div class="att-options" role="group" aria-label="สถานะเลขที่ ${E(r.number)}">${attStates.map((st,j)=>`<button type="button" data-att-i="${i}" data-att-j="${j}" class="att-chip att-${j} ${st===r.status?'selected':''}" aria-pressed="${st===r.status}" aria-label="${E(st)}" onclick="setAttendance(${i},'status',attStates[${j}])">${E(attShort[j])}</button>`).join('')}</div><input aria-label="หมายเหตุเลขที่ ${E(r.number)}" class="form-control form-control-sm att-note" placeholder="หมายเหตุ" value="${E(r.note)}" maxlength="500" oninput="setAttendance(${i},'note',this.value)"></div>`).join('')}</div>`:'<p class="empty-state">ไม่มีรายชื่อตามตัวกรองนี้</p>';attendanceCounts()}
function attendanceCounts(){$('attCounts').innerHTML=attStates.map(s=>`<div class="metric">${E(s)}<strong>${attData.records.filter(r=>r.status===s).length}</strong></div>`).join('');$('attSaved').textContent=(attDirty?'ยังไม่ได้บันทึก':attData.session?'บันทึกล่าสุด '+new Date(attData.session.updated).toLocaleString('th-TH'):'ยังไม่มีข้อมูลบันทึก')+' · เช็กแล้ว '+attData.records.filter(r=>r.status!=='ยังไม่เช็ก').length+'/'+attData.records.length+' คน'}
function setAttendance(i,k,v){if(attSaving)return;attData.records[i][k]=v;attDirty=true;if(k==='status'){if(attFilter!=='all'){renderAttendanceRows();return}document.querySelectorAll(`[data-att-i="${i}"]`).forEach(b=>{const on=attStates[Number(b.dataset.attJ)]===v;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on))})}attendanceCounts()}
function markAllAttendance(){if(attSaving)return;attData.records.forEach(r=>r.status='มาเรียน');attDirty=true;renderAttendanceRows()}
async function storeAttendance(){if(attSaving)return;if(!attData?.records.length)throw Error('กรุณาลงทะเบียนนักเรียนก่อน');if(!attDirty){toast('ไม่มีข้อมูลใหม่ที่ต้องบันทึก');return}attSaving=true;const controls=[...$('content').querySelectorAll('button,input,select')];controls.forEach(x=>x.disabled=true);try{attData=await rpc('saveAttendance',cid,attDate,attPeriod,attData.session?.version||0,attData.records);attDirty=false;toast('บันทึกเวลาเรียนแล้ว')}finally{attSaving=false;controls.forEach(x=>x.disabled=false);attendanceCounts()}}
async function attendanceSummary(){if(attDirty)throw Error('บันทึกเวลาเรียนก่อน');const b=await rpc('getAttendanceSummary',cid);const heads=['เลขที่','ชื่อ',...attStates,'ร้อยละมาเรียน/มาสาย','เสี่ยงต่ำกว่า 80%'];const rows=b.students.map(r=>{const n=attStates.slice(0,6).reduce((a,s)=>a+r.counts[s],0),pct=n?100*(r.counts['มาเรียน']+r.counts['มาสาย'])/n:null;return [r.number,r.name,...attStates.map(s=>r.counts[s]),pct===null?'—':pct.toFixed(2),pct===null?'ไม่ทราบ':pct<80?'เสี่ยง':'—']});show(panel(`<div class="toolbar noprint">${button('กลับไปเช็กชื่อ','return attendancePage()')}${button('พิมพ์','window.print()')}${button('CSV','return downloadAttendance()','outline-primary')}</div><h5>${E(labelCourse(D.courses.find(c=>c.id===cid)))}</h5><p>บันทึก ${b.sessions.length} คาบ · นับมาเรียนและมาสายเป็นเวลาเรียน · ไม่นับคาบที่ยังไม่เช็กในตัวหาร · เป็นเกณฑ์ติดตามเบื้องต้น ไม่ตัดสิน มส อัตโนมัติ</p>`+table(heads,rows.map(r=>r.map(E)))));window.attExport=[heads,...rows]}
function downloadAttendance(){download('attendance.csv','\ufeff'+window.attExport.map(r=>r.map(v=>{let s=String(v);if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(',')).join('\r\n'))}
async function randomPage(){randomYear=randomYear||D.settings.currentYear||D.years[0]?.id;const rooms=D.rooms.filter(r=>!r.archived||D.courses.some(c=>c.yearId===randomYear&&c.roomId===r.id));if(!rooms.some(r=>r.id===randomRoom))randomRoom=rooms[0]?.id||'';const g=generation,y=randomYear,r=randomRoom,b=r?await rpc('getRandomRoster',y,r):{roster:[],history:[],cycle:1};if(g!==generation||y!==randomYear||r!==randomRoom)return;const used=new Set(b.history.map(x=>x.studentId));show(panel(`<div class="toolbar">${sel('ry',yearOptions(),y,'act(async()=>{randomYear=this.value;await randomPage()})')}${sel('rr',rooms.map(r=>[r.id,r.name]),r,'act(async()=>{randomRoom=this.value;await randomPage()})')}</div><div class="text-center py-4"><i class="bi bi-shuffle" style="font-size:48px;color:var(--accent)"></i><h5>สุ่มนักเรียน</h5><div class="display-5 fw-bold my-3" id="drawName">${E(b.history.at(-1)?.name||'พร้อมสุ่ม')}</div><p>นักเรียน ${b.roster.length} คน · ยังไม่ถูกสุ่ม ${b.roster.filter(x=>!used.has(x.studentId)).length} คน · รอบ ${b.cycle}</p><label class="mb-3"><input type="checkbox" id="noRepeat" checked> ไม่สุ่มชื่อซ้ำในรอบเดียวกัน</label><div>${button('สุ่มชื่อ','return runDraw(false)')} ${button('เริ่มรอบใหม่และสุ่ม','return runDraw(true)','outline-primary')}</div></div>`+table(['ลำดับ','ชื่อ','เวลา'],b.history.map((x,i)=>[i+1,E(x.name),E(new Date(x.time).toLocaleString('th-TH'))]))))}
let drawing=false;async function runDraw(reset){if(drawing)return;if(!randomRoom)throw Error('ไม่มีห้องเรียน');drawing=true;try{const v=await rpc('drawStudent',randomYear,randomRoom,$('noRepeat').checked,reset);await randomPage();await Swal.fire({title:'นักเรียนที่ได้รับเลือก',text:v.name,icon:'success'})}finally{drawing=false}}

async function signOut(){if(!await leaveAttendance())return;if(saving||dirty.size){await flush();if(saving||dirty.size)throw Error('ยังมีคะแนนที่ไม่ได้บันทึก');}const t=authToken;authToken='';dashboardMemory.clear();studentPageRows=[];selectionReset();document.body.classList.add('login-locked');$('loginGate').hidden=false;$('content').replaceChildren();D={};B=null;await requestApi({action:'logout',token:t});location.reload();}
function togglePasswordVisibility(){const x=$('loginPassword'),show=x.type==='password';x.type=show?'text':'password';$('togglePassword').textContent=show?'ซ่อนรหัสผ่าน':'แสดงรหัสผ่าน';$('togglePassword').setAttribute('aria-pressed',String(show))}
try{const saved=localStorage.getItem('gradebook.username');if(saved){$('loginUsername').value=saved;$('rememberUser').checked=true}}catch(e){}
$('loginCard').addEventListener('submit',async e=>{e.preventDefault();const u=$('loginUsername').value.trim(),p=$('loginPassword').value;const btn=$('loginSubmit');btn.disabled=true;btn.textContent='กำลังเข้าสู่ระบบ…';$('loginError').textContent='';try{const result=await requestApi({action:'login',username:u,password:p});authToken=result.token;try{if($('rememberUser').checked)localStorage.setItem('gradebook.username',u);else localStorage.removeItem('gradebook.username')}catch(e){}$('loginPassword').value='';$('loginPassword').type='password';$('togglePassword').textContent='แสดงรหัสผ่าน';await refresh();if(!dirty.size)year=year||D.settings.currentYear;nav();document.body.classList.remove('login-locked');$('loginGate').hidden=true;if(dirty.size){saveLabel('ร่างคะแนนยังอยู่ — กดบันทึกทันทีเพื่อตรวจสอบ');return;}if(attDirty){attendanceCounts();return;}await render();}catch(err){$('loginError').textContent=String(err.message||err);document.body.classList.add('login-locked');$('loginGate').hidden=false;}finally{btn.disabled=false;btn.textContent='เข้าสู่ระบบ';}});
window.addEventListener('pageshow',e=>{if(e.persisted){authToken='';document.body.classList.add('login-locked');$('loginGate').hidden=false;location.reload();}});
window.addEventListener('online',()=>{document.getElementById('networkHint').hidden=true});window.addEventListener('offline',()=>{document.getElementById('networkHint').hidden=false});
if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
